<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>at-chat benchmarks</title>
    </head>
    <body>
        <!--
            `npm run benchmarks` compiles benchmarks.js next to this file. Open this page
            straight off disk and leave it until every row has settled.

            The page is written by hand rather than letting the compiler emit one, because
            `lamdera make --output=some.html` produces a page that waits for a `lamdera live`
            dev server to tell it to start, and so stays blank when opened on its own.
        -->
        <div id="benchmarks"></div>
        <script src="benchmarks.js"></script>
        <script>
            Elm.BenchmarkRunner.init({ node: document.getElementById("benchmarks") });
        </script>
    </body>
</html>
